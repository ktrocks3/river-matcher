[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "river-graph-matcher"
version = "0.1.0"
description = "Tree-decomposition-based matching of embedded river networks."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "numpy",
    "networkx",
    "numba",
    "shapely",
    "matplotlib",
    "PySide6",
    "pyqtgraph",
    "pillow>=12.2.0",
    "curvesimilarities>=0.3.0",
    "dtaidistance>=2.4.0",
]


[project.optional-dependencies]
experiments = [
    "openpyxl",
]

frechet = [
    "curvesimilarities",
]

legacy = [
    "tslearn",
]

dev = [
    "build",
    "line-profiler",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]


[tool.setuptools]
package-dir = { "" = "src" }


[tool.setuptools.package-data]
river_matcher = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]


[tool.ruff]
target-version = "py312"
line-length = 180

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


[tool.mypy]
python_version = "3.12"
files = ["src/river_matcher"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true


[[tool.mypy.overrides]]
module = [
    "curvesimilarities.*",
    "numba.*",
    "pyqtgraph.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["dtaidistance"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["river_matcher"]


[tool.coverage.report]
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "types-networkx>=3.6.1.20260624",
    "types-shapely>=2.1.0.20260630",
]
